name: CI

# The contract with OpenClaw: a version bump must pass the tests that boot the real gateway, the plugin and Pocket's
# tool endpoint together (tools/pip-openclaw-native.test.mjs). Nothing else catches a protocol or plugin-SDK change
# before it reaches the phone.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Contract tests (real OpenClaw gateway, scripted model)
        run: npm run test:tools
        env:
          NODE_OPTIONS: --experimental-vm-modules
