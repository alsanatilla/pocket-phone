# Pocket on Fly.io: one Node server (web app + Pip's worker, see Dockerfile and services/server/start.mjs).
# Frankfurt sits next to the Turso database in eu-west-1. The machine never sleeps: Pip's scheduled jobs run in it.
app = "pocket-phone"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  BETTER_AUTH_URL = "https://pocket-phone.fly.dev"
  # A reply runs in the web process that received it; followers get it live from memory (src/server/pip-live.js).
  # The worker beside it runs scheduled jobs and anything another deployment queued.
  PIP_RUNS_MODE = "inprocess"
  PIP_ROUTINES_EVERY_MS = "60000"
  PIP_WORKER_CONCURRENCY = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
