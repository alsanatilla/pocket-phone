# Pocket on Fly.io: one Node server (web app + Pip's worker, see Dockerfile and services/server/start.mjs).
# Frankfurt sits next to the Turso database in eu-west-1. The machine never sleeps: Pip's scheduled jobs run in it.
app = "pocket-phone"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "pocket_data"
  destination = "/data"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  BETTER_AUTH_URL = "https://pocket-phone.fly.dev"
  # A reply runs in the web process that received it; followers get it live from memory (src/server/pip-live.js).
  # The worker beside it runs scheduled jobs and anything another deployment queued.
  PIP_RUNS_MODE = "inprocess"
  # Pip's agent, workspace and memory are the OpenClaw gateway beside the web process; it is loopback only.
  PIP_GATEWAY = "1"
  # Chat replies run natively on OpenClaw (src/server/pip-openclaw.js): the gateway owns the loop and the session,
  # Pocket's tools come from its plugin. The classic browser app keeps its own loop.
  PIP_OPENCLAW_NATIVE = "1"
  PIP_GATEWAY_HOME = "/data/openclaw"
  PIP_GATEWAY_PORT = "18789"
  PIP_GATEWAY_AGENT = "pocket"
  # Fastest on Pip's real ~12k-token prompt, measured from the Fly machine: 1.08 s to first token, against 1.21 s
  # for Kimi K3.1 Pro, 1.36 s for MiniMax M3.1 Flash and 6.7 s for GLM 5.3. A short prompt made Kimi look faster.
  PIP_GATEWAY_MODEL = "deepseek-v4.1-flash"
  PIP_GATEWAY_BASE_URL = "https://opencode.ai/inference/go/openai/v1"
  PIP_ROUTINES_EVERY_MS = "60000"
  PIP_WORKER_CONCURRENCY = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"
