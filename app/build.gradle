plugins {
    id 'com.android.application'
}

android {
    namespace 'org.textphone.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'org.textphone.launcher'
        minSdk 23
        targetSdk 35
        versionCode 19
        versionName '0.5.14'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        rom {
            initWith release
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        // The Anthropic SDK uses java.time; desugaring keeps Android 6/7 (API 23-25) working.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // Server-side libraries pulled in by the Anthropic SDK ship the same metadata files.
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            // The ROM edition has its own essential-app grid and intent tests.
            if (name == 'testRomUnitTest') exclude '**/MainActivityTest.class'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            // Honor the build machine's existing proxy and trust settings for Robolectric's SDK downloads.
            ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort',
             'http.nonProxyHosts', 'javax.net.ssl.trustStore'].each { key ->
                if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
            }
        }
    }
}

dependencies {
    // Only for Drive authorization (cloud sync is opt-in). Drive itself is called over plain HTTPS.
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    // Reading journal pages with Claude (opt-in, the user's own API key).
    implementation 'com.anthropic:anthropic-java:2.34.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
