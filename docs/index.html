<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#000000"><title>pocket</title>
<style>body{margin:0;background:#000;color:#fff;font:16px/1.6 ui-monospace,monospace}main{max-width:560px;margin:12vh auto;padding:24px}h1,a{color:#f9f594}button,a{font:inherit;display:block;background:none;border:0;padding:16px 0;text-align:left;cursor:pointer}button{color:#fff}a{text-decoration:none}</style></head>
<body><main><h1>pocket</h1><a href="https://pocket-phone.vercel.app/">open Pocket ↗</a><button id="backup" type="button">download this browser’s workspace</button></main>
<script>
document.getElementById('backup').onclick = () => {
  const documents = {};
  for (const name of ['parking.json','receipt.json','dice.json','notes.json','tasks.json','journal.json','gym.json']) {
    const value = localStorage.getItem('pocket:' + name);
    if (value) { try { documents[name] = JSON.parse(value); } catch {} }
  }
  const data = { format: 'pocket-workspace', version: 1, exportedAt: new Date().toISOString(), documents };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  const link = document.createElement('a'); link.href = url; link.download = 'pocket-backup.json'; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
</script></body></html>
